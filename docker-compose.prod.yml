# 生产编排:Caddy 反代外网 + api / web / admin / ai-service / postgres 内网通信。
#
# 前提:
# - 服务器已装 docker + docker compose
# - /opt/blog/.env 准备好(生产 secret,不进 git)
# - 域名 www.iyouren.top + iyouren.top + admin.iyouren.top 解析到本机 IP
#
# 启动:`docker compose -f docker-compose.prod.yml --env-file /opt/blog/.env up -d`

services:
  postgres:
    # pgvector 镜像内置 vector 扩展,基于 postgres:16,跟原镜像数据兼容
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 不暴露 5432 到外网,只走内部网络

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AI_SERVICE_BASE_URL: http://ai-service:8001
      UPLOAD_ROOT: /app/uploads
    volumes:
      # 上传图片持久化:容器重启 / rebuild 不丢
      - blog_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/articles"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      # build context 收紧到 apps/web,只 COPY 已 build 的 .output;
      # 详细原因看 apps/web/Dockerfile 顶部注释
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: https://www.iyouren.top/api
      # sitemap.xml / feed.xml / og:url 等需要对外完整 URL
      NUXT_PUBLIC_SITE_URL: https://www.iyouren.top
      PORT: 3000

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped

  ai-service:
    build:
      context: ./apps/ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      XIAOMI_MIMO_API_KEY: ${XIAOMI_MIMO_API_KEY}
      XIAOMI_MIMO_BASE_URL: ${XIAOMI_MIMO_BASE_URL}
      XIAOMI_MIMO_MODEL: ${XIAOMI_MIMO_MODEL}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      # AI2 起 ai-service 自己直读 articles 表做 RAG 检索
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # LangSmith tracing(可选,不设 LANGCHAIN_TRACING_V2 等于关闭)
      # 没设时 LangGraph 完全不调 smith.langchain.com,无副作用
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-blog-ai}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
    healthcheck:
      # python:3.12-slim 没有 wget,改用 python 自带 urllib
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - admin

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  blog_uploads:
