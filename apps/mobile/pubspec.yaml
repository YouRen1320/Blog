name: mobile
description: "Youren blog mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # iOS 风格图标。
  cupertino_icons: ^1.0.8

  # v3 设计字体:Source Serif 4 / Cormorant Garamond / Inter / JetBrains Mono / Noto Serif SC
  google_fonts: ^6.2.1

  # ── V1-V3 业务依赖 ─────────────────────────────────
  # 状态管理 + DI(社区主流,优于 Provider)
  flutter_riverpod: ^2.6.1

  # 路由(替代 MaterialApp.home,支持 deeplinking、guards、嵌套)
  go_router: ^14.6.2

  # HTTP 客户端(比 http 包更强:拦截器、超时、formdata、并发)
  dio: ^5.7.0

  # 持久化:token 走 secure_storage(KeyChain / Keystore),其它配置走 prefs
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Markdown 渲染:文章详情用
  flutter_markdown: ^0.7.4+1

  # 加载 .env(运行时):API 地址、AI key 之类配置
  flutter_dotenv: ^5.2.1

  # 录音 + 麦克风 permission(V1.5 加,语音输入入口转真接通)
  record: ^5.2.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
