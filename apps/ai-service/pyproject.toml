[project]
name = "ai-service"
version = "0.1.0"
description = "Blog AI content generation service (FastAPI + OpenAI-compatible LLM via Xiaomi MiMo)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # FastAPI multipart/form-data 支持(/transcribe 接 audio file 用)
    "python-multipart>=0.0.18",
    # OpenAI SDK 留作 fallback 直连(LiteLLM 也用它做 OpenAI 兼容协议的底层)
    "openai>=1.50.0",
    # 多模型路由:统一接口跑 OpenAI / Anthropic / Gemini / Qwen / MiMo,
    # 不用为每个 provider 写一份 SDK 调用代码
    "litellm>=1.55.0",
    # Prompt / 调用追踪。LiteLLM 自带 langfuse 集成,设了 env + callback 就自动发,
    # 业务代码 0 侵入。云免费 tier 就够小博客用
    "langfuse>=2.55.0",
    # OpenTelemetry 全栈追踪(默认不发,只有设了 OTEL_EXPORTER_OTLP_ENDPOINT 才工作)
    # 跟 NestJS 端的 OTel 配合,trace 跨服务串起来(NestJS HTTP → ai-service)
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    # 环境变量解析 + 类型校验
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    # HTTPx 已被 openai 间接依赖,这里显式列出方便手写 client
    "httpx>=0.27.0",
    # 本地 embedding(BGE-small-zh-v1.5,中文好,~100MB,ONNX runtime,推理 < 100ms)
    "fastembed>=0.4.0",
    # pg 客户端 + 向量扩展支持
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    # LangGraph(单独装,不引整个 langchain 仓库),AI2-05 用
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
