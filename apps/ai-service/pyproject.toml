[project]
name = "ai-service"
version = "0.1.0"
description = "Blog AI content generation service (FastAPI + Anthropic-compatible LLM)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Anthropic SDK,我们让它指向小米 MiMo 的 Claude 兼容端点
    "anthropic>=0.40.0",
    # 环境变量解析 + 类型校验
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    # HTTPx 已被 anthropic 间接依赖,这里显式列出方便手写 client
    "httpx>=0.27.0",
    # 本地 embedding(BGE-small-zh-v1.5,中文好,~100MB,ONNX runtime,推理 < 100ms)
    "fastembed>=0.4.0",
    # pg 客户端 + 向量扩展支持
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    # LangGraph(单独装,不引整个 langchain 仓库),AI2-05 用
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
