# PR 与 main 共用同一组检查；只有 main 的 push 可以进入生产部署。
# 所有 Actions 都固定到完整提交 SHA，避免可移动标签引入供应链变化。

name: 持续集成与生产部署

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: API、Admin 与 Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # 迁移会创建 vector 扩展，普通 postgres 镜像无法满足要求。
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blog:blog@localhost:5432/blog?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 7d
      AI_SERVICE_BASE_URL: http://127.0.0.1:8001
      NODE_ENV: test
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.18.0

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        working-directory: apps/api
        run: pnpm exec prisma generate

      - name: 在空 pgvector 数据库执行迁移
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: 检查管理员初始化代码
        run: pnpm --filter api exec eslint 'src/cli/**/*.ts'

      - name: 运行 API 单元测试
        run: pnpm --filter api exec jest --runInBand

      - name: 运行 API 数据库 E2E
        run: pnpm --filter api test:e2e

      - name: 构建 API
        run: pnpm --filter api build

      - name: 构建 Admin
        run: pnpm --filter admin build

      - name: 构建 Web
        run: pnpm --filter web build

      - name: 打包并校验 Web 产物
        env:
          ARTIFACT_BASENAME: web-output-${{ github.sha }}
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/${ARTIFACT_BASENAME}.tar.gz" -C apps/web .output
          cd "$RUNNER_TEMP"
          sha256sum "${ARTIFACT_BASENAME}.tar.gz" > "${ARTIFACT_BASENAME}.tar.gz.sha256"
          test -s "${ARTIFACT_BASENAME}.tar.gz"
          test -s "${ARTIFACT_BASENAME}.tar.gz.sha256"

      - name: 保存 commit 对应的 Web 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-output-${{ github.sha }}
          path: |
            ${{ runner.temp }}/web-output-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/web-output-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ai-test:
    name: AI 服务
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: 安装 AI 服务依赖
        working-directory: apps/ai-service
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: 运行 AI 服务测试
        working-directory: apps/ai-service
        env:
          USE_MOCK_LLM: 'true'
          XIAOMI_MIMO_API_KEY: ci-test-key
        run: .venv/bin/pytest -v

  deploy:
    name: 部署生产环境
    needs: [test, ai-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: 校验部署配置
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_DEPLOY_DIR: ${{ secrets.SERVER_DEPLOY_DIR }}
          SERVER_SSH_FINGERPRINT: ${{ secrets.SERVER_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_DEPLOY_DIR"
          test -n "$SERVER_SSH_FINGERPRINT"

      - name: 下载本次检查生成的 Web 产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-output-${{ github.sha }}
          path: deploy-artifact

      - name: 传输 Web 产物
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          source: deploy-artifact/web-output-${{ github.sha }}.tar.gz,deploy-artifact/web-output-${{ github.sha }}.tar.gz.sha256
          target: ${{ secrets.SERVER_DEPLOY_DIR }}/.deploy-artifacts/${{ github.sha }}
          strip_components: 1
          overwrite: true

      - name: 检出同一 commit 并部署
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            deploy_sha='${{ github.sha }}'
            deploy_dir='${{ secrets.SERVER_DEPLOY_DIR }}'
            artifact_dir="$deploy_dir/.deploy-artifacts/$deploy_sha"
            artifact_file="$artifact_dir/web-output-$deploy_sha.tar.gz"

            test -n "$deploy_dir"
            test -f "$artifact_file"
            test -f "$artifact_file.sha256"

            cd "$artifact_dir"
            sha256sum -c "$(basename "$artifact_file").sha256"

            cd "$deploy_dir"
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo '部署目录存在未提交的已跟踪改动，已停止部署。'
              exit 1
            fi

            git fetch --no-tags origin main
            git cat-file -e "$deploy_sha^{commit}"
            git merge-base --is-ancestor "$deploy_sha" origin/main
            git checkout --detach "$deploy_sha"
            test "$(git rev-parse HEAD)" = "$deploy_sha"

            staged_output="$deploy_dir/apps/web/.output.next-$deploy_sha"
            current_output="$deploy_dir/apps/web/.output"
            previous_output="$deploy_dir/apps/web/.output.previous"
            rm -rf "$staged_output" "$previous_output"
            mkdir -p "$staged_output"
            tar -xzf "$artifact_file" --strip-components=1 -C "$staged_output"
            test -f "$staged_output/server/index.mjs"

            if [ -d "$current_output" ]; then
              mv "$current_output" "$previous_output"
            fi
            mv "$staged_output" "$current_output"

            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              up -d --build --remove-orphans --wait --wait-timeout 180
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
            printf '%s\n' "$deploy_sha" > "$artifact_dir/DEPLOYED_SHA"
